server:
  port: 8080

spring:
  application:
    name: art-nexus-server
  config:
    import: optional:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

canvas:
  auto-save-interval: 30000
  auto-save-batch-size: 100

relay:
  turn-timeout-minutes: 30
